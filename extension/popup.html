<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Webtwist</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="head">
  <img src="icon.png" alt="" width="18" height="18">
  <span class="name" id="themeName">Omarchy</span>
  <span class="mode" id="sourcePill"></span>
</div>

<div class="swatches" id="swatches"></div>

<section class="palette">
  <div class="label">Palette</div>
  <div class="chips" id="paletteChips"></div>
  <p class="hint" id="paletteHint"></p>
</section>

<label class="toggle" for="siteToggle">
  <input type="checkbox" id="siteToggle">
  <span>Theme this site</span>
</label>

<p class="status" id="status">Checking&hellip;</p>

<script src="popup.js"></script>
</body>
</html>
