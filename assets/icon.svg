      <stop offset="1" stop-color="#4a9861"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="4" y="4" width="120" height="120" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
